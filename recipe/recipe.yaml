schema_version: 1

context:
  name: pygitguardian
  version: "1.34.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pygitguardian-${{ version }}.tar.gz
  sha256: b0ea1d1ef76ed429ea16ad0f4deafe90f7d162715624b55b0e962c076baf2c57

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - marshmallow >=3.18,<5
    - requests >=2,<3
    - marshmallow-dataclass >=8.7,<8.8
    - typing_extensions
    - setuptools >=70.1.0

tests:
  - python:
      imports:
        - pygitguardian
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "Python Wrapper for GitGuardian's API -- Scan security policy breaks everywhere"
  license: MIT
  license_file: LICENSE
  homepage: https://www.gitguardian.com

extra:
  recipe-maintainers:
    - janjagusch
